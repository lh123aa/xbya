<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小忆桌宠 · VRM 渲染层</title>
  <script type="importmap">
  {
    "imports": {
      "three": "./js/three.module.js"
    }
  }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #petx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
      touch-action: none;
    }
    #petx-status {
      position: fixed;
      left: 8px;
      bottom: 8px;
      max-width: 80%;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font: 12px/1.5 system-ui, "Microsoft YaHei", sans-serif;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #petx-status.error { background: rgba(160, 30, 30, 0.8); }
    #petx-status.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="petx-canvas"></canvas>
  <div id="petx-status" class="hidden">正在启动…</div>

  <!--
    静态 JS 必须带缓存失效参数。
    起因：`ui/pet_window.py` 只给 **模型路径** 加了 `_t` 时间戳防缓存，
    `viewer.html` 引的 `./js/app.js` / `./js/bridge.js` 是**裸相对路径**。
    QWebEngine 因此会沿用缓存的旧 JS —— 表现是「改了 app.js 却完全没生效」，
    而服务端文件、`py_compile`、grep **全都显示正确**，极难排查。
    实测踩到：给 app.js 加了朝向的 console.log，重启后日志里没有那行。

    修法：把 Python 传来的 `_t`（它本来就在 URL 上）拼到脚本地址后面。
    这同时也让「改了 JS 立刻生效」这件事不再依赖用户手动清缓存。
  -->
  <script>
    (function () {
      var t = new URLSearchParams(window.location.search).get('_t') || String(Date.now());
      var bridge = document.createElement('script');
      bridge.src = './js/bridge.js?t=' + encodeURIComponent(t);
      document.head.appendChild(bridge);
      // app.js 是 type=module，必须带同样的 type 才能按模块语义加载
      var app = document.createElement('script');
      app.type = 'module';
      app.src = './js/app.js?t=' + encodeURIComponent(t);
      document.head.appendChild(app);
    })();
  </script>
  <script>
    (function () {
      window.addEventListener('error', function (ev) {
        console.log('STACK: ' + ((ev.error && ev.error.stack) || (ev.message + ' @ ' + ev.filename + ':' + ev.lineno)));
        var d = document.getElementById('petx-status');
        if (d) {
          d.textContent = (ev.error && ev.error.stack) ? ev.error.stack.split('\n').slice(0, 8).join(' | ') : (ev.message || 'runtime error');
          d.classList.remove('hidden');
        }
      });
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason && (ev.reason.stack || ev.reason.message) || String(ev.reason);
        console.log('REJECTION: ' + r);
        var d = document.getElementById('petx-status');
        if (d) { d.textContent = 'async error: ' + (ev.reason && ev.reason.message || 'unknown'); d.classList.remove('hidden'); }
      });
    })();
  </script>
</body>
</html>
